{% extends "base.html" %}
{% block meta %}
    <title>{{ form_title }} - {{ name }}</title>
{% endblock meta %}
{% block content %}
<section class="experience-section">
    <div class="container">
        <h1 class="text-h2 font-heading" mb-6>{{ form_title }}</h1>
        <form method="post" class="project-form">
            {% csrf_token %}
            {% for field in form %}
                <div class="form-group">
                    <label for="{{ field.id_for_label }}">{{ field.label }}</label>
                    {{ field }}
                    {% for error in field.errors %}
                        <p class="form-error">{{ error }}</p>
                    {% endfor %}
                </div>
            {% endfor %}
            <div class="form-actions">
                <button type="submit" class="button">{{ submit_label }}</button>
                <a href="{% url 'main:show_experience' %}" class="button button-secondary">Batal</a>
            </div>
        </form>
    </div>
</section>
{% endblock content %}

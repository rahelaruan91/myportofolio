<div id="delete-project-{{ project.id }}"
    class="project-delete-modal"
    popover="auto"
    role="dialog"
    aria-modal="true"
    aria-labelledby="delete-project-title-{{ project.id }}">
    
    <button type="button"
            class="project-delete-modal__backdrop"
            popovertarget="delete-project-{{ project.id }}"
            popovertargetaction="hide"
            aria-label="Tutup"></button>
            
    <div class="project-delete-modal__content">
        <h2 id="delete-project-title-{{ project.id }}">Delete Project?</h2>
        <p>You will delete <strong>{{ project.title }}</strong>. Input secret code to confirm.</p>
        
        <form method="post" action="{% url 'main:delete_project' project.id %}">
            {% csrf_token %}
            <div class="form-group">
                <label for="kode-{{ project.id }}">Secret Code</label>
                <input type="password"
                    name="kode_rahasia"
                    id="kode-{{ project.id }}"
                    placeholder="Masukkan kode rahasia.."
                    required>
            </div>
            
            <div class="project-delete-modal__actions">
                <button type="button"
                        class="project-btn-solid project-btn-secondary"
                        popovertarget="delete-project-{{ project.id }}"
                        popovertargetaction="hide">Undo</button>
                <button type="submit" class="project-btn-solid project-btn-danger">Delete</button>
            </div>
        </form>
    </div>
</div>

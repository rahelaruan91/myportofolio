{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}{{ name }}{% endblock %} - Portfolio</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,500&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
    {% block meta %} {% endblock meta %}
</head>
<body>
    <header class="site-header">
        <div class="container">
            <nav>
                <a href="{% url 'main:show_main' %}" class="{% if active_page == 'main' %}active{% endif %}">About Me</a>
                <a href="{% url 'main:show_project' %}" class="{% if active_page == 'project' %}active{% endif %}">Projects</a>
                <a href="{% url 'main:show_experience' %}" class="{% if active_page == 'experience' %}active{% endif %}">Experience</a>
            </nav>
        </div>
    </header>

    <main>
        {% block content %}{% endblock content %}
    </main>

    <footer class="site-footer">
        <div class="container">
            <p>&copy; 2026 Rahel. Fakultas Ilmu Komputer, Universitas Indonesia.</p>
        </div>
    </footer>
</body>
</html>
